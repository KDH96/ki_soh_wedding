.location-address { margin:11px 0 0; color:var(--muted); font-size:13px; }.directions { display:grid; gap:17px; margin-top:27px; text-align:left; }.map-sketch { position:relative; min-height:245px; overflow:hidden; border-radius:22px; background:#f5f5f3; box-shadow:inset 0 0 0 1px rgba(75,80,94,.06); }.map-sketch__road { position:absolute; display:block; background:#fffdfb; box-shadow:0 0 0 2px #5b6276; }.map-sketch__road--vertical { top:25px; bottom:-10px; left:47%; width:30px; }.map-sketch__road--horizontal { top:52%; right:-20px; left:12px; height:26px; }.map-sketch__route { position:absolute; z-index:1; top:35%; left:29%; width:28%; height:27%; border-top:4px solid #4e576d; border-right:4px solid #4e576d; border-bottom:4px solid #4e576d; }.map-sketch__venue,.map-sketch__station,.map-sketch__walk { position:absolute; z-index:2; display:grid; place-items:center; text-align:center; }.map-sketch__venue { top:13%; left:17%; min-width:88px; padding:8px 9px; border-radius:12px; color:#fff; background:#4f596f; font-size:11px; font-weight:800; line-height:1.35; }.map-sketch__station { right:13%; bottom:16%; padding:8px 12px; border-radius:16px; color:#fff; background:#4f596f; font-size:12px; font-weight:800; line-height:1.2; }.map-sketch__station small { margin-top:3px; color:#f7d7ca; font-size:9px; }.map-sketch__walk { right:24%; bottom:43%; color:#4f596f; font-size:10px; font-weight:800; }.transport { display:grid; gap:14px; }.transport article { padding:0 0 14px; border-bottom:1px solid rgba(94,76,66,.13); }.transport article:last-child { padding-bottom:0; border:0; }.transport h3 { margin:0; color:#5b4b43; font-size:13px; }.transport p { margin:7px 0 0; color:#66554c; font-size:12px; line-height:1.7; }.location-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:18px; }.button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:11px 14px; border:1px solid rgba(137,97,82,.3); border-radius:999px; color:#80 :11px; font-weight:800; }.talk { display:grid; place-items:center; width:19px; height:16px; border-radius:7px 7px 7px 2px; color:#fee500; background:#3a2c1e; font-size:6px; }.share-copy { min-height:39px; padding:0 14px; border:1px solid rgba(255,255,255,.3); border-radius:999px; color:#fffaf6; background:transparent; font-size:11px; font-weight:700; }
[data-reveal] { opacity:0; transform:translateY(24px); transition:opacity .7s cubic-bezier(.22,.61,.36,1),transform .7s cubic-bezier(.22,.61,.36,1); } [data-reveal].visible { opacity:1; transform:none; } @keyframes petalFall { 0% { transform:translate3d(0,0,0); opacity:var(--opacity,.42); } 88% { opacity:var(--opacity,.42); } 100% { transform:translate3d(0,108svh,0); opacity:0; } } @keyframes enterFromRight { from { opacity:.22; transform:translateX(36px); } to { opacity:1; transform:none; } } @keyframes enterFromLeft { from { opacity:.22; transform:translateX(-36px); } to { opacity:1; transform:none; } } @media(min-width:560px) { .directions { grid-template-columns:1fr 1.2fr; align-items:start; }.map-sketch { min-height:286px; } } @media(max-width:420px) { .section { padding-right:22px; padding-left:22px; }.photo-story__frame { min-height:560px; }.photo-story__frame img { min-height:542px; }.photo-story__nav { width:35px; font-size:37px; }.photo-story__nav--previous { left:13px; }.photo-story__nav--next { right:13px; } } @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; } .petal { animation-duration:var(--d,24s)!important; animation-iteration-count:1!important; } [data-reveal] { opacity:1; transform:none; } }

    dateISO: "2027-01-30T14:00:00+09:00",

    accounts: [
      { group: "신부측", name: "소혜지", bank: "○○은행", number: "000-0000-0000-00" },
      { group: "신랑측", name: "기도희", bank: "○○은행", number: "000-0000-0000-00" }
    ]

  const state = { photoIndex: 0, swipeStartX: null };
  const app = document.querySelector("#invitationApp");
  const escape = (value) => String(value).replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
  const photo = (item) => item?.src || fallbackPhoto;

  function calendarMarkup() {
    const date = new Date(invitation.dateISO);
    const year = date.getFullYear();
    const month = date.getMonth();
    const weddingDay = date.getDate();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDay = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let index = 0; index < firstDay; index += 1) cells.push('<span class="calendar__day calendar__day--blank" aria-hidden="true"></span>');
    for (let day = 1; day <= lastDay; day += 1) {
      const isWedding = day === weddingDay;
      cells.push(`<span class="calendar__day${isWedding ? " calendar__day--wedding" : ""}"${isWedding ? ' aria-label="결혼식 당일, 1월 30일"' : ""}>${day}</span>`);

  }

  function directionMarkup() {
    return `<div class="directions"><div class="map-sketch" role="img" aria-label="문정역 3번 출구에서 더 컨벤션 송파문정까지 도보 5분 약도"><span class="map-sketch__venue">더 컨벤션<br>송파문정</span><span class="map-sketch__station">문정역<br><small>3번 출구</small></span><span class="map-sketch__walk">도보 5분</span><i class="map-sketch__route"></i><i class="map-sketch__road map-sketch__road--vertical"></i><i class="map-sketch__road map-sketch__road--horizontal"></i></div><div class="transport"><article><h3>지하철</h3><p>8호선 문정역 3번 출구<br>도보 5분</p></article><article><h3>버스</h3><p>문정역 · 문정법조단지 정류장 하차<br>간선 302 · 303 · 320 · 333 · 350 · 360 · 362<br>지선 3012 · 3322</p></article><article><h3>주차 안내</h3><p>NH송파농협 건물 내 주차장 이용 가능 (약 800대)<br>예식장 외 주차장이 혼잡할 수 있으니 가급적 대중교통 이용을 부탁드립니다.</p></article></div></div>`;
  }

  function appMarkup() {
    const accounts = invitation.accounts.map((item) => `<details class="account"><summary><span><small>${escape(item.group)}</small><strong>${escape(item.name)}</strong></span></summary><div class="account__inside"><p>${escape(item.bank)} ${escape(item.number)}</p><button type="button" data-copy-account="${escape(item.number)}">계좌번호 복사</button></div></details>`).join("");
    const firstPhoto = invitation.gallery[0];
    return `<div class="scene" aria-hidden="true"><div class="scene__petals" id="petalField"></div></div><div class="app"><main><section class="hero" style="--hero-image:url('${escape(photo(firstPhoto))}')"><div class="hero__content"><h1 class="hero__title">We are getting married</h1><div class="hero__bottom"><p class="hero__names">${escape(invitation.bride)} <span>&amp;</span> ${escape(invitation.groom)}</p><p class="hero__date">${escape(invitation.date)}</p></div></div></section><section class="section section--cream" id="message" data-reveal><p class="eyebrow">INVITATION</p><h2 class="section-title">소중한 분들을 초대합니다</h2><p class="message">${escape(invitation.message)}</p><div class="family"><p><small>신부</small> 아버지 소진남 · 어머니 노경화의 <strong>혜지</strong></p><p><small>신랑</small> 아버지 기계석 · 어머니 유은정의 <strong>도희</strong></p></div></section><section class="section section--sage" id="moments" data-reveal><h2 class="gallery-heading">Our Memories</h2><div class="photo-story" id="photoStory" tabindex="0" aria-label="사진첩. 좌우로 밀거나 버튼을 눌러 사진을 넘길 수 있습니다."><div class="photo-story__frame"><img id="storyImage" src="${escape(photo(firstPhoto))}" alt="${escape(firstPhoto.alt)}" /><button class="photo-story__nav photo-story__nav--previous" id="photoPrevious" type="button" aria-label="이전 사진">‹</button><button class="photo-story__nav photo-story__nav--next" id="photoNext" type="button" aria-label="다음 사진">›</button></div><div class="photo-story__meta"><span id="photoCount" class="photo-story__count">01 / ${String(invitation.gallery.length).padStart(2, "0")}</span><p id="photoCaption" aria-live="polite">${escape(firstPhoto.caption)}</p></div></div></section><section class="section" data-reveal><p class="eyebrow">THE DAY</p><h2 class="section-title">${escape(invitation.date)}</h2><div class="schedule-card"><strong>2027. 01. 30. SAT</strong><p>두 사람이 함께 시작할 첫 번째 날입니다.</p><div class="countdown" id="countdown"></div></div>${calendarMarkup()}</section><section class="section section--cream" data-reveal><p class="eyebrow">LOCATION</p><h2 class="section-title">${escape(invitation.venue)}</h2><p class="location-address">${escape(invitation.address)}</p>${directionMarkup()}<div class="location-actions"><a class="button button--solid" href="https://map.kakao.com/?q=%EB%8D%94%20%EC%BB%A8%EB%B2%A4%EC%85%98%20%EC%86%A1%ED%8C%8C%EB%AC%B8%EC%A0%95" target="_blank" rel="noreferrer">지도 보기</a><button class="button" type="button" id="copyAddress">주소 복사</button></div></section><section class="section" data-reveal><p class="eyebrow">GIFT</p><h2 class="section-title">마음 전하실 곳</h2><p class="description">계좌 카드를 눌러 계좌번호를 확인할 수 있습니다.</p><div class="accounts">${accounts}</div></section><section class="section section--sage" data-reveal><p class="eyebrow">GUESTBOOK</p><h2 class="section-title">따뜻한 마음을 남겨주세요</h2><div class="guest"><article><header><strong>소중한 친구</strong><time>2027. 09. 01</time></header><p>두 분의 새로운 시작을 진심으로 축하합니다.</p></article><article><header><strong>가족</strong><time>2027. 09. 03</time></header><p>늘 행복하고 웃음 가득한 날들 보내세요.</p></article></div></section></main><footer class="footer">${escape(invitation.bride)} · ${escape(invitation.groom)}의 결혼식에 초대합니다</footer><div class="share-strip"><button class="share-kakao" id="shareKakao" type="button"><span class="talk">TALK</span>카카오톡으로 공유하기</button><button class="share-copy" id="shareCopy" type="button">링크 복사</button></div></div>`;
  }

  function setImageFallback(image) { image.addEventListener("error", () => { if (image.getAttribute("src") !== fallbackPhoto) image.src = fallbackPhoto; }); }
  function renderCountdown() { const remaining = Math.max(0, new Date(invitation.dateISO).getTime() - Date.now()); const units = [["일", Math.floor(remaining / 86400000)], ["시간", Math.floor(remaining / 3600000) % 24], ["분", Math.floor(remaining / 60000) % 60], ["초", Math.floor(remaining / 1000) % 60]]; document.querySelector("#countdown").innerHTML = units.map(([label, value]) => `<div><strong>${String(value).padStart(2, "0")}</strong><span>${label}</span></div>`).join(""); }
  function renderPhoto(direction = "next") { const item = invitation.gallery[state.photoIndex]; const image = document.querySelector("#storyImage"); image.classList.remove("photo-story__image--from-left", "photo-story__image--from-right"); void image.offsetWidth; image.classList.add(direction === "previous" ? "photo-story__image--from-left" : "photo-story__image--from-right"); image.src = photo(item); image.alt = item.alt; document.querySelector("#photoCaption").textContent = item.caption; document.querySelector("#photoCount").textContent = `${String(state.photoIndex + 1).padStart(2, "0")} / ${String(invitation.gallery.length).padStart(2, "0")}`; }
  function movePhoto(delta) { state.photoIndex = (state.photoIndex + delta + invitation.gallery.length) % invitation.gallery.length; renderPhoto(delta < 0 ? "previous" : "next"); }
  function copyText(value) { if (navigator.clipboard?.writeText) navigator.clipboard.writeText(value).catch(() => window.prompt("복사해 주세요.", value)); else window.prompt("복사해 주세요.", value); }
  function setupPetalVariation() { const field = document.querySelector("#petalField"); const random = (min, max) => min + Math.random() * (max - min); const createPetal = () => { const petal = document.createElement("span"); petal.className = "petal"; petal.style.setProperty("--x", `${random(6, 91).toFixed(1)}%`); petal.style.setProperty("--s", `${random(9, 16).toFixed(1)}px`); petal.style.setProperty("--angle", `${random(-42, 42).toFixed(0)}deg`); petal.style.setProperty("--d", `${random(16, 20).toFixed(1)}s`); petal.style.setProperty("--opacity", random(.28, .48).toFixed(2)); petal.addEventListener("animationend", () => petal.remove(), { once: true }); field.append(petal); }; const schedulePetal = () => { createPetal(); window.setTimeout(schedulePetal, random(1100, 1600)); }; schedulePetal(); }
  function setupCarousel() { const story = document.querySelector("#photoStory"); document.querySelector("#photoPrevious").addEventListener("click", () => movePhoto(-1)); document.querySelector("#photoNext").addEventListener("click", () => movePhoto(1)); story.addEventListener("pointerdown", (event) => { if (event.target.closest("button")) return; state.swipeStartX = event.clientX; story.setPointerCapture?.(event.pointerId); }); story.addEventListener("pointerup", (event) => { if (state.swipeStartX === null) return; const distance = event.clientX - state.swipeStartX; state.swipeStartX = null; if (Math.abs(distance) >= 42) movePhoto(distance < 0 ? 1 : -1); }); story.addEventListener("pointercancel", () => { state.swipeStartX = null; }); story.addEventListener("keydown", (event) => { if (event.key === "ArrowLeft") { event.preventDefault(); movePhoto(-1); } if (event.key === "ArrowRight") { event.preventDefault(); movePhoto(1); } }); }
  function setupEvents() { document.querySelectorAll("img").forEach(setImageFallback); setupCarousel(); document.querySelector("#copyAddress").addEventListener("click", () => copyText(invitation.address)); document.querySelectorAll("[data-copy-account]").forEach((button) => button.addEventListener("click", () => copyText(button.dataset.copyAccount))); document.querySelector("#shareCopy").addEventListener("click", () => copyText(location.href)); document.querySelector("#shareKakao").addEventListener("click", async () => { if (navigator.share) { try { await navigator.share({ title: document.title, text: "기도희 · 소혜지의 모바일 청첩장", url: location.href }); return; } catch (error) { if (error?.name === "AbortError") return; } } copyText(location.href); }); }
  function setupReveal() { const targets = document.querySelectorAll("[data-reveal]"); if (!window.IntersectionObserver || window.matchMedia("(prefers-reduced-motion: reduce)").matches) { targets.forEach((target) => target.classList.add("visible")); return; } const observer = new IntersectionObserver((entries) => entries.forEach((entry) => { if (entry.isIntersecting) { entry.target.classList.add("visible"); observer.unobserve(entry.target); } }), { threshold: 0.12 }); targets.forEach((target) => observer.observe(target)); }

  app.innerHTML = appMarkup();
  setupPetalVariation();
  renderCountdown();
  window.setInterval(renderCountdown, 1000);
  setupEvents();
  setupReveal();
})();

</script>
  </body>
</html>
