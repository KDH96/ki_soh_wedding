    <style>
:root {
  --ink: #29312b;
  --muted: #667168;
  --cream: #f7f3ee;
  --paper: #fbfaf8;
  --sage: #e8ece3;
  --sage-deep: #71836f;
  --line: rgba(41, 49, 43, .14);
  --accent: #bd806b;
  --shadow: 0 18px 45px rgba(51, 53, 47, .12);
  color: var(--ink);
  background: #e9e7e2;
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-synthesis: none;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-width: 320px; background: #e9e7e2; }
button, input, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

.page-shell { width: min(100%, 640px); min-height: 100vh; margin: 0 auto; overflow: hidden; background: var(--paper); box-shadow: 0 0 34px rgba(36, 40, 34, .14); }
.section { position: relative; padding: 82px 28px; text-align: center; }
.section--cream { background: var(--cream); }
.section--sage { background: var(--sage); }
.eyebrow { margin: 0 0 14px; color: var(--sage-deep); font-size: 10px; font-weight: 700; letter-spacing: .2em; }
.section-title { margin: 0; font-family: "Gowun Batang", "Nanum Myeongjo", serif; font-size: clamp(25px, 6vw, 34px); font-weight: 400; line-height: 1.45; letter-spacing: -.04em; }
.section-description { margin: 12px 0 28px; color: var(--muted); font-size: 13px; line-height: 1.7; }

.hero { min-height: max(680px, 100svh); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 28px 36px; background: #e8ece3; isolation: isolate; }
.hero__paper-grain { position: absolute; z-index: -1; inset: 0; opacity: .5; background-image: radial-gradient(rgba(47, 53, 45, .15) .6px, transparent .6px); background-size: 7px 7px; mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent); }
.hero__names { max-width: 420px; margin: 0; font-family: "Gowun Batang", "Nanum Myeongjo", serif; font-size: clamp(29px, 7.5vw, 45px); font-weight: 400; line-height: 1.35; letter-spacing: -.075em; }
.hero__names span { margin: 0 5px; color: var(--accent); font-family: Georgia, serif; font-size: .78em; font-style: italic; }
.hero__date { margin: 17px 0 35px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .08em; }
.hero__photo-wrap { width: min(72vw, 350px); aspect-ratio: 4 / 5; overflow: hidden; padding: 8px; background: #fffdf9; box-shadow: var(--shadow); transform: rotate(2deg); }
.hero__photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.floating-photo { animation: float 5s ease-in-out infinite; }
.scroll-cue { display: grid; place-items: start center; width: 26px; height: 46px; margin-top: 32px; border: 1px solid rgba(41, 49, 43, .5); border-radius: 20px; }
.scroll-cue span { width: 3px; height: 8px; margin-top: 9px; border-radius: 2px; background: var(--sage-deep); animation: scroll-dot 1.8s ease-in-out infinite; }

.message__body { margin: 31px auto 35px; white-space: pre-line; color: #3e473f; font-family: "Nanum Myeongjo", serif; font-size: 15px; line-height: 2.15; letter-spacing: -.025em; }
.parents { display: grid; gap: 12px; max-width: 310px; margin: 0 auto; padding: 22px 0 0; border-top: 1px solid var(--line); }
.parent-row { display: flex; align-items: baseline; justify-content: center; gap: 7px; font-family: "Nanum Myeongjo", serif; font-size: 14px; }
.parent-row small { min-width: 51px; color: var(--muted); font-family: Pretendard, sans-serif; font-size: 11px; text-align: left; }
.parent-row em { color: var(--muted); font-size: 11px; font-style: normal; }

.calendar { padding-top: 80px; }
.calendar .section-title { margin-bottom: 29px; font-size: 23px; }
.calendar-card { max-width: 390px; margin: 0 auto; padding: 18px 16px 16px; border: 1px solid var(--line); background: #fff; box-shadow: 0 8px 18px rgba(57, 63, 55, .04); }
.calendar-card__head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 15px; }
.calendar-card__head strong { font-family: "Nanum Myeongjo", serif; font-size: 16px; }
.calendar-card__head button { width: 32px; height: 28px; border: 0; color: #b8bdb7; background: transparent; font-size: 24px; line-height: 1; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px 2px; }
.calendar-grid span { display: grid; place-items: center; height: 35px; font-size: 12px; }
.calendar-grid--days span { height: 24px; color: var(--muted); font-size: 10px; }
.calendar-grid--days span:first-child, .calendar-grid span:nth-child(7n + 1) { color: #be756b; }
.calendar-day--empty { pointer-events: none; }
.calendar-day--wedding { position: relative; z-index: 0; color: white !important; font-weight: 700; }
.calendar-day--wedding::before { position: absolute; z-index: -1; width: 31px; height: 31px; border-radius: 50%; background: var(--accent); content: ""; }
.countdown { display: flex; justify-content: center; gap: 11px; margin-top: 31px; }
.countdown__unit { min-width: 60px; }
.countdown__unit strong { display: block; font-family: "Nanum Myeongjo", serif; font-size: 21px; font-weight: 400; }
.countdown__unit span { color: var(--muted); font-size: 9px; letter-spacing: .08em; }

.moments__collage { position: relative; width: min(100%, 470px); height: 440px; margin: 35px auto 0; }
.moment { position: absolute; overflow: hidden; padding: 6px; background: #fffdf9; box-shadow: 0 14px 28px rgba(51, 61, 51, .15); }
.moment img { width: 100%; height: 100%; object-fit: cover; }
.moment:nth-child(1) { top: 6px; left: 2%; width: 52%; height: 276px; transform: rotate(-4deg); animation: drift-a 7s ease-in-out infinite; }
.moment:nth-child(2) { top: 142px; right: 2%; width: 47%; height: 268px; transform: rotate(5deg); animation: drift-b 8s ease-in-out infinite; }
.moment:nth-child(3) { top: 47px; right: 7%; width: 35%; height: 156px; transform: rotate(7deg); animation: drift-c 6.5s ease-in-out infinite; }

.gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.gallery-item { position: relative; min-height: 190px; overflow: hidden; border: 0; background: #e5e5df; }
.gallery-item:nth-child(3n + 1) { grid-row: span 2; min-height: 388px; }
.gallery-item img { width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; transition: transform .5s ease; }
.gallery-item::after { position: absolute; inset: 0; background: rgba(27, 32, 26, .1); content: ""; opacity: 0; transition: opacity .25s ease; }
.gallery-item:hover img, .gallery-item:focus-visible img { transform: scale(1.04); }
.gallery-item:hover::after, .gallery-item:focus-visible::after { opacity: 1; }
.gallery__more { margin-top: 25px; }

.map-card { display: grid; place-items: center; min-height: 185px; margin-top: 29px; overflow: hidden; border: 1px solid var(--line); background: repeating-linear-gradient(45deg, rgba(112, 131, 111, .09) 0 2px, transparent 2px 28px), #e3e9df; }
.map-card__pin { display: grid; place-items: center; width: 45px; height: 45px; margin: 0 auto 10px; border-radius: 50% 50% 50% 0; color: #fff; background: var(--accent); transform: rotate(-45deg); box-shadow: 0 3px 8px rgba(106, 67, 57, .2); }
.map-card__pin::first-letter { transform: rotate(45deg); }
.map-card p { margin: 0; color: var(--ink); font-size: 13px; font-weight: 600; }
.location__address { margin: 12px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.location__buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 16px; border: 1px solid transparent; border-radius: 0; font-size: 13px; font-weight: 600; transition: transform .18s ease, background .18s ease; }
.button:hover { transform: translateY(-1px); }
.button--dark { color: white; background: var(--ink); }
.button--outline { border-color: rgba(41, 49, 43, .35); color: var(--ink); background: transparent; }
.transport { display: grid; gap: 0; margin-top: 31px; border-top: 1px solid var(--line); text-align: left; }
.transport__row { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 17px 3px; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.6; }
.transport__row strong { font-size: 12px; }
.transport__row span { color: var(--muted); }

.accounts__list { display: grid; gap: 10px; margin-top: 29px; text-align: left; }
.account { padding: 17px 17px 15px; border: 1px solid var(--line); background: #fff; }
.account__top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.account__group { color: var(--sage-deep); font-size: 11px; font-weight: 700; }
.account__name { font-size: 14px; font-weight: 700; }
.account__number { margin: 10px 0 0; color: var(--muted); font-family: "Nanum Myeongjo", serif; font-size: 14px; letter-spacing: .025em; }
.account button { float: right; margin-top: -3px; padding: 4px 0 4px 10px; border: 0; color: var(--sage-deep); background: transparent; font-size: 11px; font-weight: 700; }

.guestbook-form { display: grid; gap: 12px; margin-top: 29px; text-align: left; }
.guestbook-form label { display: grid; gap: 7px; color: var(--ink); font-size: 12px; font-weight: 600; }
.guestbook-form input, .guestbook-form textarea { width: 100%; border: 1px solid rgba(41, 49, 43, .22); border-radius: 0; outline: none; color: var(--ink); background: rgba(255, 255, 255, .67); font-size: 14px; font-weight: 400; transition: border-color .2s; }
.guestbook-form input { height: 47px; padding: 0 13px; }
.guestbook-form textarea { min-height: 112px; padding: 13px; resize: vertical; line-height: 1.6; }
.guestbook-form input:focus, .guestbook-form textarea:focus { border-color: var(--sage-deep); }
.guestbook-form input::placeholder, .guestbook-form textarea::placeholder { color: #9a9d97; }
.turnstile { min-height: 0; }
.form-message { min-height: 20px; margin: -2px 0 0; color: var(--sage-deep); font-size: 12px; line-height: 1.6; }
.form-message--error { color: #ab5e55; }
.honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.guestbook-list { display: grid; gap: 10px; margin-top: 36px; text-align: left; }
.guestbook-entry { padding: 17px; border-left: 2px solid var(--sage-deep); background: rgba(255, 255, 255, .48); }
.guestbook-entry__meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }
.guestbook-entry__meta strong { color: var(--ink); font-size: 13px; }
.guestbook-entry p { margin: 11px 0 0; white-space: pre-wrap; font-size: 13px; line-height: 1.7; }
.guestbook-empty { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }

.footer { padding: 34px 25px calc(34px + env(safe-area-inset-bottom)); color: rgba(255, 255, 255, .8); background: var(--ink); font-family: "Nanum Myeongjo", serif; font-size: 12px; line-height: 1.7; text-align: center; }
.toast { position: fixed; z-index: 30; bottom: 28px; left: 50%; max-width: calc(100% - 38px); padding: 12px 16px; border-radius: 4px; color: white; background: rgba(34, 42, 35, .92); box-shadow: var(--shadow); font-size: 13px; opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: .25s ease; }
.toast--visible { opacity: 1; transform: translate(-50%, 0); }

.lightbox { width: min(100%, 640px); height: 100dvh; max-width: none; max-height: none; padding: 55px 15px 30px; border: 0; color: white; background: rgba(18, 23, 18, .97); }
.lightbox::backdrop { background: rgba(18, 23, 18, .7); }
.lightbox figure { display: grid; align-items: center; height: 100%; margin: 0; }
.lightbox figure img { width: 100%; max-height: calc(100dvh - 118px); object-fit: contain; }
.lightbox figcaption { margin-top: 12px; color: rgba(255, 255, 255, .75); font-size: 12px; text-align: center; }
.lightbox__close, .lightbox__nav { position: absolute; z-index: 1; border: 0; color: white; background: transparent; }
.lightbox__close { top: 14px; right: 17px; font-size: 34px; font-weight: 200; }
.lightbox__nav { top: 50%; padding: 12px 8px; font-size: 42px; line-height: 1; transform: translateY(-50%); }
.lightbox__nav--prev { left: 3px; }.lightbox__nav--next { right: 3px; }

@keyframes float { 0%, 100% { transform: rotate(2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-7px); } }
@keyframes scroll-dot { 0%, 100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(15px); opacity: 1; } }
@keyframes drift-a { 0%, 100% { transform: rotate(-4deg) translate(0, 0); } 50% { transform: rotate(-4deg) translate(0, -7px); } }
@keyframes drift-b { 0%, 100% { transform: rotate(5deg) translate(0, 0); } 50% { transform: rotate(5deg) translate(0, 8px); } }
@keyframes drift-c { 0%, 100% { transform: rotate(7deg) translate(0, 0); } 50% { transform: rotate(7deg) translate(5px, -5px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (min-width: 641px) { .section { padding-left: 43px; padding-right: 43px; } }

</style>

    image.addEventListener("error", () => {

    }, { once: true });
  }

  function renderParents(data) {

    ];
    parentList.replaceChildren(...people.map(({ label, person }) => {

      row.className = "parent-row";
      const labelElement = document.createElement("small");
      labelElement.textContent = label;
      const parents = document.createElement("span");
      parents.textContent = `${person.father} · ${person.mother}`;
      const of = document.createElement("em");
      of.textContent = "의";
      const name = document.createElement("strong");
      name.textContent = person.name;

      return row;
    }));

  function renderCalendar(data) {
    const parts = formatDateParts(data.date);
    setText("#scheduleTitle", data.dateDisplay || koreanDate.format(new Date(data.date)));
    setText("#calendarMonth", `${parts.year}. ${String(parts.month).padStart(2, "0")}`);

    const firstDay = new Date(parts.year, parts.month - 1, 1).getDay();
    const lastDate = new Date(parts.year, parts.month, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDay; i += 1) cells.push(null);
    for (let day = 1; day <= lastDate; day += 1) cells.push(day);
    while (cells.length % 7 !== 0) cells.push(null);

    const days = $("#calendarDays");
    days.replaceChildren(...cells.map((day) => {
      const cell = document.createElement("span");
      if (day === null) cell.className = "calendar-day--empty";
      else {
        cell.textContent = day;
        if (day === parts.day) {
          cell.classList.add("calendar-day--wedding");
          cell.setAttribute("aria-label", `결혼식 날짜 ${day}일`);
        }
      }
      return cell;
    }));
  }

    const target = new Date(dateString).getTime();
    const remaining = Math.max(0, target - Date.now());
    const units = [
      ["일", Math.floor(remaining / 86400000)],
      ["시간", Math.floor((remaining / 3600000) % 24)],
      ["분", Math.floor((remaining / 60000) % 60)],
      ["초", Math.floor((remaining / 1000) % 60)]
    ];
    countdown.replaceChildren(...units.map(([label, number]) => {
      const element = document.createElement("div");
      element.className = "countdown__unit";
      const value = document.createElement("strong");
      value.textContent = String(number).padStart(2, "0");

      unit.textContent = label;
      element.append(value, unit);
      return element;
    }));

      body.textContent = item.body;
      row.append(title, body);
      return row;
    }));
  }

  function copyText(value, message) {
    if (!value) return showToast("복사할 내용이 없습니다.");
    const complete = () => showToast(message || "복사했습니다.");
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(value).then(complete).catch(() => fallbackCopy(value, complete));
    } else fallbackCopy(value, complete);
  }

  function fallbackCopy(value, complete) {
    const area = document.createElement("textarea");
    area.value = value;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.append(area);
    area.select();
    try { document.execCommand("copy"); complete(); } catch { showToast("복사하지 못했습니다. 직접 선택해 주세요."); }
    area.remove();
  }

  function renderAccounts(items) {
    const list = $("#accountsList");
    list.replaceChildren(...(items || []).map((item) => {
      const account = document.createElement("article");
      account.className = "account";
      const top = document.createElement("div");
      top.className = "account__top";
      const group = document.createElement("span");
      group.className = "account__group";
      group.textContent = item.group;
      const name = document.createElement("strong");
      name.className = "account__name";
      name.textContent = item.name;
      top.append(group, name);
      const number = document.createElement("p");
      number.className = "account__number";
      number.textContent = `${item.bank} ${item.number}`;
      const copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = "계좌번호 복사";
      copy.addEventListener("click", () => copyText(item.number, "계좌번호를 복사했습니다."));
      account.append(top, number, copy);
      return account;
    }));
  }

  function formatGuestDate(value) {
    if (!value) return "";
    if (/^\d{4}\.\s?\d{2}\.\s?\d{2}$/.test(value)) return value;
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? value : `${date.getFullYear()}. ${String(date.getMonth() + 1).padStart(2, "0")}. ${String(date.getDate()).padStart(2, "0")}`;
  }

  function renderGuestbook(messages) {
    const list = $("#guestbookList");
    if (!messages?.length) {
      const empty = document.createElement("p");
      empty.className = "guestbook-empty";
      empty.textContent = "첫 번째 축하 글을 남겨주세요.";
      list.replaceChildren(empty);
      return;
    }
    list.replaceChildren(...messages.slice(0, 30).map((item) => {
      const entry = document.createElement("article");
      entry.className = "guestbook-entry";
      const meta = document.createElement("div");
      meta.className = "guestbook-entry__meta";
      const name = document.createElement("strong");
      name.textContent = item.name || "익명";
      const date = document.createElement("time");
      date.textContent = formatGuestDate(item.date || item.createdAt);
      meta.append(name, date);
      const body = document.createElement("p");
      body.textContent = item.message || "";
      entry.append(meta, body);
      return entry;
    }));
  }

  function loadGuestbook(endpoint, fallbackMessages) {
    if (!endpoint) return renderGuestbook(fallbackMessages);
    const callback = `guestbookCallback_${Date.now()}`;
    const script = document.createElement("script");
    const separator = endpoint.includes("?") ? "&" : "?";
    const cleanup = () => {
      delete window[callback];
      script.remove();
    };
    const timeout = window.setTimeout(() => { cleanup(); renderGuestbook(fallbackMessages); }, 8000);
    window[callback] = (result) => {
      window.clearTimeout(timeout);
      cleanup();
      renderGuestbook(Array.isArray(result?.messages) ? result.messages : fallbackMessages);
    };
    script.onerror = () => { window.clearTimeout(timeout); cleanup(); renderGuestbook(fallbackMessages); };
    script.src = `${endpoint}${separator}action=messages&callback=${callback}`;
    document.head.append(script);
  }

  function renderTurnstile(siteKey) {
    if (!siteKey) return;
    const widget = document.createElement("div");
    widget.className = "cf-turnstile";
    widget.dataset.sitekey = siteKey;
    $("#turnstileContainer").append(widget);
    const script = document.createElement("script");
    script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js";
    script.async = true;
    script.defer = true;
    document.head.append(script);
  }

  function setupGuestbook(config) {
    const form = $("#guestbookForm");
    const endpoint = String(config.endpoint || "").trim();
    const submit = $("#guestbookSubmit");
    const status = $("#guestbookStatus");
    $("#formToken").value = crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`;
    $("#guestbookPage").value = location.href.split("#")[0];
    loadGuestbook(endpoint, config.initialMessages || []);

    if (!endpoint || !endpoint.startsWith("https://")) {
      submit.disabled = true;
      submit.textContent = "방명록 설정 후 이용 가능";
      status.textContent = "관리자는 운영 가이드의 방명록 설정을 완료해 주세요.";
      return;
    }

    form.action = endpoint;
    renderTurnstile(config.turnstileSiteKey);
    $("#guestbookFrame").addEventListener("load", () => {
      if (!state.guestbookSubmitted) return;
      state.guestbookSubmitted = false;
      submit.disabled = false;
      submit.textContent = "축하 글 남기기";
      status.classList.remove("form-message--error");
      status.textContent = "축하 글을 받았습니다. 확인 후 방명록에 공개됩니다.";
      form.reset();
    });
    form.addEventListener("submit", (event) => {
      const name = $("#guestName").value.trim();
      const message = $("#guestMessage").value.trim();
      if (!name || !message) {
        event.preventDefault();
        status.classList.add("form-message--error");
        status.textContent = "이름과 축하 메시지를 입력해 주세요.";
        return;
      }
      state.guestbookSubmitted = true;
      submit.disabled = true;
      submit.textContent = "전송 중…";
      status.classList.remove("form-message--error");
      status.textContent = "안전하게 전송하고 있습니다.";
    });
  }

  function showToast(message) {
    const toast = $("#toast");
    toast.textContent = message;
    toast.classList.add("toast--visible");
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => toast.classList.remove("toast--visible"), 2300);
  }

  function setupInteractions(data) {
    $("#galleryMore").addEventListener("click", () => { state.visibleGalleryCount += 6; renderGallery(); });
    $("#lightboxClose").addEventListener("click", () => $("#lightbox").close());
    $("#lightboxPrevious").addEventListener("click", () => moveLightbox(-1));
    $("#lightboxNext").addEventListener("click", () => moveLightbox(1));
    $("#lightbox").addEventListener("click", (event) => { if (event.target === $("#lightbox")) $("#lightbox").close(); });
    document.addEventListener("keydown", (event) => {
      if (!$("#lightbox").open) return;
      if (event.key === "ArrowLeft") moveLightbox(-1);
      if (event.key === "ArrowRight") moveLightbox(1);
    });
    $("#copyAddress").addEventListener("click", () => copyText(data.venue?.address, "예식장 주소를 복사했습니다."));
  }

  function renderInvitation(data) {
    state.data = data;
    document.title = data.siteTitle || "모바일 청첩장";
    const groom = data.groom?.name || "신랑";
    const bride = data.bride?.name || "신부";
    const names = $("#heroNames");
    names.replaceChildren(document.createTextNode(`${groom} `), Object.assign(document.createElement("span"), { textContent: "&" }), document.createTextNode(` ${bride}`));
    setText("#heroDate", data.dateDisplay || koreanDate.format(new Date(data.date)));
    safeImage($("#heroImage"), data.heroImage, data.heroAlt);
    setText("#invitationText", data.invitation);
    setText("#footer", data.footer);
    renderParents(data);
    renderCalendar(data);
    updateCountdown(data.date);
    window.setInterval(() => updateCountdown(data.date), 1000);
    renderMoments(data.momentPhotos);
    renderGallery();
    renderLocation(data);
    renderAccounts(data.accounts);
    setupGuestbook(data.guestbook || {});
    setupInteractions(data);
  }

  async function boot() {
    try {
      const embedded = document.querySelector("#embeddedInvitationConfig");
      if (embedded?.textContent?.trim()) {
        renderInvitation(JSON.parse(embedded.textContent));
        return;
      }
      const response = await fetch("data/invitation.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`설정 파일을 읽지 못했습니다 (${response.status})`);
      renderInvitation(await response.json());
    } catch (error) {
      console.error(error);
      setText("#invitationText", "청첩장 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
      showToast("청첩장 정보를 불러오지 못했습니다.");
    }
  }

  boot();
})();

</script>

  function getConfig() {
    try { return JSON.parse(document.querySelector("#embeddedInvitationConfig")?.textContent || "{}"); } catch { return {}; }
  }

  function replaceCollageWithGallery(gallery) {
    const collage = document.querySelector(".moments__collage");
    if (!collage || !gallery.length) return;
    const items = gallery.slice(0, 3).map((photo) => {
      const frame = document.createElement("div");
      frame.className = "moment";
      const image = document.createElement("img");
      image.src = photo.src || fallbackPhoto;
      image.alt = photo.alt || "두 사람의 사진";
      image.loading = "lazy";
      image.addEventListener("error", () => { image.src = fallbackPhoto; }, { once: true });
      frame.append(image);
      return frame;
    });
    collage.replaceChildren(...items);
  }

  function mergePhotoStory() {
    const moments = document.querySelector("#moments");
    const gallery = document.querySelector("#gallery");
    if (!moments || !gallery) return;
    moments.classList.add("photo-story");
    moments.querySelector(".eyebrow").textContent = "OUR PHOTOS";
    moments.querySelector(".section-title").textContent = "두 사람의 순간";
    const description = document.createElement("p");
    description.className = "section-description";
    description.textContent = "사진을 누르면 크게 보실 수 있습니다.";
    const sourceDescription = gallery.querySelector(".section-description");
    sourceDescription?.remove();
    const grid = gallery.querySelector("#galleryGrid");
    const more = gallery.querySelector("#galleryMore");
    const collage = moments.querySelector(".moments__collage");
    collage?.after(description, grid, more);
    gallery.remove();
  }

  function setupLightboxNavigation() {
    const dialog = document.querySelector("#lightbox");
    const image = document.querySelector("#lightboxImage");
    const previous = document.querySelector("#lightboxPrevious");
    const next = document.querySelector("#lightboxNext");
    if (!dialog || !image || !previous || !next) return;

    const animate = (direction) => {
      image.classList.remove("slide-next", "slide-prev");
      void image.offsetWidth;
      image.classList.add(direction === "next" ? "slide-next" : "slide-prev");
    };
    next.addEventListener("click", () => animate("next"), { capture: true });
    previous.addEventListener("click", () => animate("prev"), { capture: true });
    image.addEventListener("animationend", () => image.classList.remove("slide-next", "slide-prev"));

    let startX = null;
    dialog.addEventListener("pointerdown", (event) => { if (dialog.open) startX = event.clientX; });
    dialog.addEventListener("pointerup", (event) => {
      if (startX === null) return;
      const distance = event.clientX - startX;
      startX = null;
      if (Math.abs(distance) < 45) return;
      if (distance < 0) next.click();
      else previous.click();
    });
    dialog.addEventListener("pointercancel", () => { startX = null; });
  }

  window.addEventListener("load", () => {
    document.body.classList.add("popup-preview");
    const config = getConfig();
    replaceCollageWithGallery(Array.isArray(config.gallery) ? config.gallery : []);
    mergePhotoStory();
    setupLightboxNavigation();
  }, { once: true });
})();
